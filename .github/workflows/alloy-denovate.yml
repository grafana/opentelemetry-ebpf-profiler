name: Alloy Denovate

on:
  workflow_dispatch:
    inputs:
      alloy_revision:
        description: "Alloy git revision (commit SHA, tag, or branch)"
        required: true
        type: string

permissions:
  contents: write
  pull-requests: write
  id-token: write

jobs:
  denovate:
    runs-on: ubuntu-latest
    steps:
      - name: Get secrets
        uses: grafana/shared-workflows/actions/get-vault-secrets@main
        with:
          repo_secrets: |
            GITHUB_APP_ID=pyroscope-development-app:app-id
            GITHUB_APP_PRIVATE_KEY=pyroscope-development-app:app-private-key

      - name: Generate GitHub token
        uses: actions/create-github-app-token@v2
        id: app-token
        with:
          app-id: ${{ env.GITHUB_APP_ID }}
          private-key: ${{ env.GITHUB_APP_PRIVATE_KEY }}

      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: pyroscope_alloy
          token: ${{ steps.app-token.outputs.token }}
          persist-credentials: true

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Run denovate script
        run: python3 .github/workflows/scripts/alloy-denovate.py "${{ inputs.alloy_revision }}"

      - name: Check for changes
        id: changes
        run: |
          if git diff --quiet go.mod go.sum; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Get GitHub App User ID
        if: steps.changes.outputs.changed == 'true'
        id: get-user-id
        env:
          GITHUB_TOKEN: ${{ steps.app-token.outputs.token }}
          APP_SLUG: ${{ steps.app-token.outputs.app-slug }}
        run: |
          APP_BOT="${APP_SLUG}[bot]"
          echo "user-id=$(gh api "/users/${APP_BOT}" --jq .id)" >> "$GITHUB_OUTPUT"

      - name: Create PR
        if: steps.changes.outputs.changed == 'true'
        env:
          GITHUB_TOKEN: ${{ steps.app-token.outputs.token }}
          APP_SLUG: ${{ steps.app-token.outputs.app-slug }}
          USER_ID: ${{ steps.get-user-id.outputs.user-id }}
          ALLOY_REVISION: ${{ inputs.alloy_revision }}
        run: |
          APP_BOT="${APP_SLUG}[bot]"
          git config user.name "${APP_BOT}"
          git config user.email "${USER_ID}+${APP_BOT}@users.noreply.github.com"

          SHORT_REV="${ALLOY_REVISION:0:12}"
          BRANCH="denovate/alloy-${SHORT_REV}"

          git checkout -b "${BRANCH}"
          git add go.mod go.sum
          git commit -m "chore: denovate otel deps to match alloy ${SHORT_REV}"
          git push origin "${BRANCH}"

          gh pr create \
            --base pyroscope_alloy \
            --head "${BRANCH}" \
            --title "chore: denovate otel deps to alloy ${SHORT_REV}" \
            --body "$(cat <<EOF
          Align \`go.opentelemetry.io/*\` dependency versions with Alloy revision \`${ALLOY_REVISION}\`.

          Generated by the Alloy Denovate workflow.
          EOF
          )"
