name: Denovate OpenTelemetry Dependencies from Alloy

on:
  workflow_dispatch:
    inputs:
      alloy_revision:
        description: Alloy revision to sync against (optional; defaults to main)
        required: false
        type: string

permissions:
  contents: read

jobs:
  denovate:
    runs-on: ubuntu-24.04
    env:
      GOTOOLCHAIN: auto
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Checkout pyroscope_alloy
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: true
          ref: pyroscope_alloy

      - name: Set up Go
        uses: actions/setup-go@7a3fe6cf4cb3a834922a1244abfce67bcef6a0c5 # v6.2.0
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum

      - name: Run denovate
        env:
          GH_TOKEN: ${{ github.token }}
        run: go run ./tools/denovate-opentelemetry-from-alloy.go "${{ inputs.alloy_revision }}"
